x-app-env: &app-env
  DATABASE_URL: postgresql+asyncpg://rag:rag@db:5432/rag
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-secret-change-me-in-production-0000}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  MODEL_CACHE_DIR: /models
  ENVIRONMENT: local

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment: *app-env
    depends_on:
      db: { condition: service_healthy }

  api:
    build: .
    environment: *app-env
    ports: ["8000:8000"]
    # Shared with the worker, so the ONNX models are downloaded once, not per container.
    volumes: [models:/models]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  worker:
    build: .
    command: ["arq", "app.workers.settings.WorkerSettings"]
    environment: *app-env
    volumes: [models:/models]
    healthcheck:
      disable: true  # the image's HTTP healthcheck is for the API; the worker serves no HTTP
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

volumes:
  pgdata:
  models:
